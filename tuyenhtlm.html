<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web Của Tôi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            color: #333;
            text-align: center;
            padding-top: 100px;
            margin: 0;
        }
        .card {
            background: #ffffff;
            width: 400px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        h1 {
            color: #0984e3;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            color: #636e72;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Xin chào!</h1>
        <p><b>Họ và tên:</b> Đinh Văn Tuyên </p>
        <p><b>Mã số sinh viên:</b> 251230995</p>
        <p>Đây là trang web bài tập của tôi.</p>
    </div>
</body>
</html>
